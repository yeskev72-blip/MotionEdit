<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/overlay.css" />
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1c0e07;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "IBM Plex Mono", monospace;
      }

      #bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(118% 62% at 50% 40%, var(--bg-1) 0%, rgba(74, 32, 16, 0) 62%),
          linear-gradient(176deg, #2a150a 0%, var(--bg-0) 52%, #140803 100%);
      }

      #grain {
        position: absolute;
        inset: 0;
        opacity: 0.5;
        background-image:
          repeating-linear-gradient(
            0deg,
            rgba(255, 255, 255, 0.013) 0 1px,
            rgba(0, 0, 0, 0) 1px 3px
          ),
          repeating-linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.009) 0 1px,
            rgba(0, 0, 0, 0) 1px 4px
          );
      }

      /* The app window sits wholly inside the TikTok safe box, with the text
         band underneath it. It is untimed on purpose: a <video data-start>
         may not sit inside another timed element.

         The recording is 1080x2182 and the window is 780 wide, so the video
         renders at 780 x 1576 (scale 0.72222) and the window shows a
         1191px-tall slice of the source. Each clip carries its own `top`
         offset, which is what puts that beat's key content in the slice —
         the whole phone no longer fits in a TikTok-safe frame, so the film
         shows the part that matters instead of shrinking all of it. */
      #stage {
        position: absolute;
        left: var(--win-x);
        top: var(--win-y);
        width: var(--win-w);
        height: var(--win-h);
      }

      #glow {
        position: absolute;
        left: -110px;
        top: -110px;
        width: 1000px;
        height: 1080px;
        border-radius: 120px;
        background: radial-gradient(
          54% 46% at 50% 50%,
          rgba(216, 168, 96, 0.3) 0%,
          rgba(199, 83, 29, 0.14) 44%,
          rgba(199, 83, 29, 0) 72%
        );
      }

      #screen {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 38px;
        background: var(--cream);
        box-shadow:
          0 40px 100px rgba(0, 0, 0, 0.62),
          0 10px 30px rgba(0, 0, 0, 0.42);
      }

      /* 780 / 1080 = 0.72222 → 2182 * 0.72222 = 1576 */
      #screen video {
        position: absolute;
        left: 0;
        width: 780px;
        height: 1576px;
      }

      #bezel {
        position: absolute;
        inset: 0;
        border-radius: 38px;
        border: 2px solid rgba(255, 255, 255, 0.17);
        box-shadow: inset 0 0 0 1px rgba(28, 14, 7, 0.4);
        pointer-events: none;
      }

      /* The hook plays full-bleed, not inside the device: the plate has to
         own the whole frame before the product is introduced. The source
         frame letterboxes the photo into y 444–1796 of 2182, so the video is
         sized and offset to crop exactly that band up to 1080×1920. */
      #hero {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #000;
      }

      #hero-v {
        position: absolute;
        width: 1534px;
        height: 3099px;
        left: -227px;
        top: -631px;
      }
    </style>
  </head>

      <!-- ── sound ────────────────────────────────────────────────────

           Each cue fades out before its clip ends so the hard cut at

        src="assets/sfx/impact-bass-1.mp3"
        data-start="0.42"

    <script>
      /* With the window fixed inside the safe box and the text band fixed
         under it, the old pull-back choreography is gone: nothing has to
         move out of a card's way any more. What is left is the hook's push
         and one punch on the verdict. */
      const tl = gsap.timeline({ paused: true });

      /* 1 · a slow push on the plate, so the hook has movement under it */
      tl.fromTo("#hero-v", { scale: 1 }, { scale: 1.07, duration: 2.8, ease: "none" }, 0);

      /* 1→2 · the plate hands over to the product. v2 is already running
         underneath, so the window is live before the hook clears. */
      tl.to("#hero", { opacity: 0, duration: 0.2, ease: "power2.inOut" }, 2.6);

      /* 7 · one punch as the verdict lands, then settle */
      tl.to("#stage", { scale: 1.035, duration: 0.22, ease: "power2.out" }, 12.98);
      tl.to("#stage", { scale: 1, duration: 0.7, ease: "power2.inOut" }, 13.21);

      /* 10 · hand over to the end card */
      tl.to("#stage", { opacity: 0, scale: 0.94, duration: 0.42, ease: "power2.in" }, 22.44);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
